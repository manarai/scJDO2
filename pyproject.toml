[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scjdo2"
version = "0.1.0.dev1"
description = "scJDO v2 — latent-space neighbourhood Jacobian operator fields with a Fisher confidence ledger"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tommy W. Terooatea"},
]
keywords = ["single-cell", "Jacobian", "operator field", "dynamical systems", "scRNA-seq"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "anndata>=0.10",
    "scanpy>=1.9",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "scvi-tools>=1.1",
    "dynamo-release>=1.4",
    "zarr>=2.17",
    "pyyaml>=6.0",
    "pot>=0.9",
]

[project.optional-dependencies]

# v1 scJDO at tag scjdo-v56-submission-20260922-r25 is NOT listed here as a
# pip dependency — pip would check out that tag directly inside the user's
# live scJDO repo and move HEAD, which is not what we want. Instead, run
#
#     bash scripts/install_v1_compare.sh
#
# in the activated environment. The script creates a git worktree at the
# preprint tag under $TMPDIR/scJDO-v1-<tag>/ and `pip install -e`s that path,
# leaving the live scJDO repo at its own HEAD.
compare = []

dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
]

[project.scripts]
scjdo2 = "scjdo2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scjdo2*"]
exclude = ["tests*", "notebooks*", "compare*", "benchmarks*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that take minutes (e.g. Phase B pitchfork acceptance)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
